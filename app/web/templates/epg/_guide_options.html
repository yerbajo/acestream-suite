{# Options for one row's guide picker on the mapping screen; htmx swaps them into the row's `<select>`.
   No guide matching the search is an ordinary answer, so it gets its own option instead of an
   empty list that would look like a broken control. #}
{% for guide in guides %}
<option value="{{ guide.id }}">{{ guide.name }}</option>
{% else %}
<option value="">Sin coincidencias</option>
{% endfor %}
