{% if error %}
<p class="notice notice-error" role="alert">{{ error }}</p>
{% elif playback_url %}
<p class="notice notice-ok" role="status">Reproduciendo: <a href="{{ playback_url }}" target="_blank" rel="noopener">{{ playback_url }}</a></p>
{% else %}
<p class="notice notice-ok" role="status">Abierto en VLC.</p>
{% endif %}
