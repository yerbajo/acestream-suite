{% if error %}
<p class="notice notice-error" role="alert">{{ error }}</p>
{% elif not playback_url %}
<p class="notice notice-ok" role="status">Abriendo «{{ channel.title }}» en VLC…</p>
{% else %}
<p class="notice notice-ok" role="status">«{{ channel.title }}» listo para ver.</p>
<p>Pega este enlace en VLC o mpv (en VLC, Ctrl+N):</p>
<p><code>{{ playback_url }}</code></p>
{% endif %}
